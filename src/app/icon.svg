<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Squircle com sombra -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Monograma LB em tipografia moderna -->
  <g filter="url(#glow)">
    <text
      x="32"
      y="40"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="24"
      font-weight="900"
      letter-spacing="-1"
      fill="#ffffff"
      text-anchor="middle"
    >
      LB
    </text>
  </g>

  <!-- Ponto de Telemetria Esmeralda no canto inferior direito -->
  <circle cx="48" cy="46" r="3.5" fill="#22c55e" />
  <circle cx="48" cy="46" r="6" stroke="#22c55e" stroke-width="1" opacity="0.6" />
</svg>
